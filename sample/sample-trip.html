               h, why?, deep?:{kicker,deck,body[],cite[]}, key?, next?, done? }

<script type="text/babel" data-presets="env,react">
/* eslint-disable */
// ─── Shared helpers ─────────────────────────────────────────────────────
const TRIP = window.TRIP;
const GL = { wake:"↑", light:"☀", lightoff:"◐", caffeine:"C", melatonin:"●", sleep:"☾", travel:"✈" };

const storeKey = "jetlag:" + (TRIP && TRIP.meta && TRIP.meta.planId || "default");
const themeKey = storeKey + ":theme";
const store = {
  load() { try { return JSON.parse(localStorage.getItem(storeKey) || "{}"); } catch (e) { return {}; } },
  save(s) { try { localStorage.setItem(storeKey, JSON.stringify(s)); } catch (e) {} }
};

function detectTodayIdx(trip) {
  if (!trip || !trip.days || !trip.days.length) return 0;
  const flagged = trip.days.findIndex(d => d.isToday);
  if (flagged >= 0) return flagged;
  const todayISO = new Date().toISOString().slice(0, 10);
  const matchIdx = trip.days.findIndex(d => d.date === todayISO);
  if (matchIdx >= 0) return matchIdx;
  if (trip.meta && trip.meta.today && Number.isInteger(trip.meta.today.i) && trip.meta.today.i >= 0 && trip.meta.today.i < trip.days.length) {
    const hasDates = trip.days.every(d => d.date);
    if (!hasDates) return trip.meta.today.i;
  }
  if (trip.days.every(d => d.date)) {
    const now = Date.now();
    let best = 0, bestDelta = Infinity;
    trip.days.forEach((d, i) => {
      const delta = Math.abs(new Date(d.date + "T12:00:00").getTime() - now);
      if (delta < bestDelta) { bestDelta = delta; best = i; }
    });
    return best;
  }
  return trip.meta && trip.meta.today && trip.meta.today.i || 0;
}

function isInTrip(trip) {
  if (!trip || !trip.days || !trip.days.length) return false;
  if (trip.days.some(d => d.isToday)) return true;
  if (!trip.days.every(d => d.date)) return true;
  const todayISO = new Date().toISOString().slice(0, 10);
  return trip.days.some(d => d.date === todayISO);
}

// Style D microcopy helpers (lowercase the world)
const fmtTimeD = (t) => (t || "").replace(/\s.*/, "").replace(":", " : ");
const tzLabelD = (t) => {
  const m = (t || "").match(/\b(PT|PST|PDT|CEST|CET|UTC|GMT|ET|EST|EDT|JST|BST)\b/);
  if (!m) return "";
  const map = { PT:"san francisco", PST:"san francisco", PDT:"san francisco",
    CEST:"madrid", CET:"madrid", UTC:"utc", GMT:"london", BST:"london",
    ET:"new york", EST:"new york", EDT:"new york", JST:"tokyo" };
  return map[m[1]] || m[1].toLowerCase();
};
const cleanHD = (h) => (h || "").replace(/—/g, "·").replace(/\.$/, "");

// ─── App root: theme switcher + lifts shared state up so it survives toggles ──
const App = () => {
  if (!TRIP) {
    return <div style={{padding:"28vh 24px", textAlign:"center", fontFamily:"JetBrains Mono", fontSize:11, letterSpacing:"0.2em", color:"#9a9082", background:"#F4ECD8", minHeight:"100vh"}}>NO PLAN DATA</div>;
  }
  const initial = store.load();
  const computedTodayIdx = detectTodayIdx(TRIP);
  const tripActive = isInTrip(TRIP);
  const initialTheme = (() => {
    try { return localStorage.getItem(themeKey) || (TRIP.meta && TRIP.meta.theme) || "A"; }
    catch (e) { return "A"; }
  })();

  const [theme, setThemeState] = React.useState(initialTheme);
  const setTheme = (t) => {
    setThemeState(t);
    try { localStorage.setItem(themeKey, t); } catch (e) {}
  };

  const [view, setView] = React.useState(initial.view || "plan");
  const [dayIdx, setDayIdx] = React.useState(initial.dayIdx ?? computedTodayIdx);
  const [doneIds, setDoneIds] = React.useState(initial.doneIds || []);
  const [verbose, setVerbose] = React.useState(initial.verbose ?? true);
  const [drawer, setDrawer] = React.useState(null);
  const [showMorning, setShowMorning] = React.useState(initial.showMorning !== false);
  const [expandedActionId, setExpandedActionId] = React.useState(null);

  React.useEffect(() => { store.save({ view, dayIdx, doneIds, verbose, showMorning }); }, [view, dayIdx, doneIds, verbose, showMorning]);
  React.useEffect(() => {
    const handler = (e) => {
      if (e.key === "Escape") { setDrawer(null); return; }
      if (view !== "plan" || drawer) return;
      if (e.key === "ArrowLeft" && dayIdx > 0) setDayIdx(dayIdx - 1);
      if (e.key === "ArrowRight" && dayIdx < TRIP.days.length - 1) setDayIdx(dayIdx + 1);
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [dayIdx, view, drawer]);
  React.useEffect(() => { document.body.style.overflow = drawer ? "hidden" : ""; return () => { document.body.style.overflow = ""; }; }, [drawer]);

  const toggleDone = (id) => setDoneIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);

  const sharedProps = {
    view, setView, dayIdx, setDayIdx, doneIds, toggleDone, drawer, setDrawer,
    showMorning, setShowMorning, expandedActionId, setExpandedActionId,
    verbose, setVerbose, tripActive, computedTodayIdx, theme, setTheme
  };

  const Theme = theme === "D" ? PrototypeD : PrototypeA;
  return <Theme {...sharedProps} />;
};

function romanA(slot, N) {
  const present = [
    !!(N.chartPoints && N.chartPoints.length),
    !!(N.garmin && N.garmin.length),
    !!(N.methodology && N.methodology.length),
    !!(N.refs && N.refs.length)
  ];
  let n = 0;
  for (let i = 0; i < slot; i++) if (present[i]) n++;
  return ["", "I", "II", "III", "IV"][n] || "·";
}

const ConvergenceChartA = ({ points, onPointClick }) => {
  const W = 376, H = 220, padL = 38, padR = 12, padT = 16, padB = 38;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const xMax = Math.max(1, points.length - 1);
  const yMax = Math.max(9, Math.ceil(Math.max(...points.map(p => p.y))));
  const x = (i) => padL + (i / xMax) * innerW;
  const y = (v) => padT + innerH - (v / yMax) * innerH;
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"} ${x(p.i)} ${y(p.y)}`).join(" ");
  const yTicks = [0, Math.round(yMax/3), Math.round(2*yMax/3), yMax];
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%", height:"auto", display:"block"}}>
      <line x1={padL} y1={padT} x2={padL} y2={H-padB} stroke={A_TOK.ink} strokeWidth="1"/>
      <line x1={padL} y1={H-padB} x2={W-padR} y2={H-padB} stroke={A_TOK.ink} strokeWidth="1"/>
      {yTicks.map((v, i) => (
        <g key={i}>
          <line x1={padL-3} y1={y(v)} x2={padL} y2={y(v)} stroke={A_TOK.ink} strokeWidth="1"/>
          <text x={padL-6} y={y(v)+3} textAnchor="end" fontFamily={A_TOK.mono} fontSize="9" fill={A_TOK.inkMute}>+{v}h</text>
        </g>
      ))}
      <line x1={padL} y1={y(yMax)} x2={W-padR} y2={y(yMax)} stroke={A_TOK.indigo} strokeDasharray="3 3" strokeWidth="0.8"/>
      <text x={W-padR-2} y={y(yMax)-3} textAnchor="end" fontFamily={A_TOK.mono} fontSize="8" fill={A_TOK.indigo}>DEST DLMO TARGET</text>
      <line x1={padL} y1={y(0)} x2={W-padR} y2={y(0)} stroke={A_TOK.indigo} strokeDasharray="3 3" strokeWidth="0.8"/>
      <text x={W-padR-2} y={y(0)-3} textAnchor="end" fontFamily={A_TOK.mono} fontSize="8" fill={A_TOK.indigo}>ORIGIN DLMO TARGET</text>
      <path d={path} fill="none" stroke={A_TOK.ink} strokeWidth="1.6"/>
      {points.map((p, i) => (
        <g key={i} style={{cursor: p.deep ? "pointer" : "default"}} onClick={() => p.deep && onPointClick(p)}>
          <circle cx={x(p.i)} cy={y(p.y)} r={p.isKey ? 5 : 3.2} fill={p.isKey ? A_TOK.vermil : A_TOK.paper} stroke={A_TOK.ink} strokeWidth="1.2"/>
          {p.isKey && <text x={x(p.i)} y={y(p.y)-10} textAnchor="middle" fontFamily={A_TOK.mono} fontSize="9" fill={A_TOK.vermil} fontWeight="600">★</text>}
        </g>
      ))}
      {points.map((p, i) => (
        (i % 2 === 0 || p.isKey) && p.label ? (
          <text key={i} x={x(p.i)} y={H-padB+12} textAnchor="middle" fontFamily={A_TOK.mono} fontSize="8" fill={A_TOK.inkMute}>
            {p.label.split(" ")[0].slice(0,3)} {p.label.split(" ")[1] || ""}
          </text>
        ) : null
      ))}
      <text x={padL} y={H-6} fontFamily={A_TOK.mono} fontSize="8" letterSpacing="0.18em" fill={A_TOK.inkFade}>DLMO OFFSET (HOURS) ↑   ·   {points.length}-DAY TRIP →</text>
    </svg>
  );
};

const ConvergenceChartD = ({ points, onPointClick }) => {
  const W = 376, H = 220, padL = 38, padR = 12, padT = 18, padB = 38;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const xMax = Math.max(1, points.length - 1);
  const yMax = Math.max(9, Math.ceil(Math.max(...points.map(p => p.y))));
  const x = (i) => padL + (i / xMax) * innerW;
  const y = (v) => padT + innerH - (v / yMax) * innerH;
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"} ${x(p.i)} ${y(p.y)}`).join(" ");
  const yTicks = [0, Math.round(yMax/3), Math.round(2*yMax/3), yMax];
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%", height:"auto", display:"block"}}>
      <line x1={padL} y1={padT} x2={padL} y2={H-padB} stroke={D_TOK.inkMute} strokeWidth="0.6"/>
      <line x1={padL} y1={H-padB} x2={W-padR} y2={H-padB} stroke={D_TOK.inkMute} strokeWidth="0.6"/>
      {yTicks.map((v, i) => (
        <text key={i} x={padL-6} y={y(v)+3} textAnchor="end" fontFamily={D_TOK.sans} fontSize="9" fill={D_TOK.inkMute}>+{v}h</text>
      ))}
      <line x1={padL} y1={y(yMax)} x2={W-padR} y2={y(yMax)} stroke={D_TOK.rose} strokeDasharray="2 4" strokeWidth="0.6" opacity="0.6"/>
      <text x={W-padR-2} y={y(yMax)-3} textAnchor="end" fontFamily={D_TOK.sans} fontSize="8" fill={D_TOK.rose} letterSpacing="0.10em">destination</text>
      <line x1={padL} y1={y(0)} x2={W-padR} y2={y(0)} stroke={D_TOK.rose} strokeDasharray="2 4" strokeWidth="0.6" opacity="0.6"/>
      <text x={W-padR-2} y={y(0)-3} textAnchor="end" fontFamily={D_TOK.sans} fontSize="8" fill={D_TOK.rose} letterSpacing="0.10em">origin</text>
      <path d={path} fill="none" stroke={D_TOK.ink} strokeWidth="1.2"/>
      {points.map((p, i) => (
        <g key={i} style={{cursor: p.deep ? "pointer" : "default"}} onClick={() => p.deep && onPointClick(p)}>
          <circle cx={x(p.i)} cy={y(p.y)} r={p.isKey ? 5 : 2.6}
            fill={p.isKey ? D_TOK.rose : D_TOK.paperHi}
            stroke={p.isKey ? D_TOK.rose : D_TOK.inkMute} strokeWidth="1"/>
          {p.isKey && <circle cx={x(p.i)} cy={y(p.y)} r="9" fill="none" stroke={D_TOK.rose} strokeWidth="0.6" opacity="0.4"/>}
        </g>
      ))}
      {points.map((p, i) => (
        (i % 2 === 0 || p.isKey) && p.label ? (
          <text key={i} x={x(p.i)} y={H-padB+12} textAnchor="middle" fontFamily={D_TOK.sans} fontSize="8" fill={D_TOK.inkMute} letterSpacing="0.06em">
            {p.label.split(" ")[0].toLowerCase()} {p.label.split(" ")[1] || ""}
          </text>
        ) : null
      ))}
    </svg>
  );
};
